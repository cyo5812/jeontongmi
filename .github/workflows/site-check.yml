name: 사이트 점검

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DOMAIN: jeontongmi.kro.kr
    steps:
      - name: "진단 요약(로그를 못 볼 때 annotation으로 확인)"
        if: always()
        run: |
          echo "::notice title=DNS::CNAME=$(dig +short CNAME $DOMAIN | tr '\n' ' ') A=$(dig +short A $DOMAIN | tr '\n' ' ') AAAA=$(dig +short AAAA $DOMAIN | tr '\n' ' ')"
          echo "::notice title=HTTP::$(curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url}' http://$DOMAIN/ 2>&1)"
          echo "::notice title=HTTPS::$(curl -sS -o /dev/null -w '%{http_code}' https://$DOMAIN/ 2>&1 | tr '\n' ' ')"
          echo "::notice title=PSL::$(curl -sS https://publicsuffix.org/list/public_suffix_list.dat | grep -nE '(^|\.)kro\.kr$' | tr '\n' ' ' || true) (비어 있으면 kro.kr은 Public Suffix List에 없음)"
          echo "::notice title=CT::$(curl -sS --max-time 40 'https://crt.sh/?q=jeontongmi.kro.kr&output=json' | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d), "certs", sorted({x["not_before"][:10] for x in d})[-3:])' 2>&1 | tail -1)"
          echo "::notice title=CERT::$(echo | openssl s_client -connect $DOMAIN:443 -servername $DOMAIN 2>/dev/null | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName 2>&1 | tr '\n' ' ')"
      - name: "DNS: CNAME이 cyo5812.github.io를 가리킴"
        if: always()
        run: |
          dig +short CNAME "$DOMAIN"; dig +short A "$DOMAIN"
          dig +short CNAME "$DOMAIN" | grep -qi 'cyo5812.github.io'
      - name: "DNS: A 레코드가 GitHub Pages IP로 해석됨"
        if: always()
        run: dig +short A "$DOMAIN" | grep -qE '^185\.199\.(108|109|110|111)\.153$'
      - name: "HTTP: http:// 접속 응답"
        if: always()
        run: curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url}\n' "http://$DOMAIN/" | tee /dev/stderr | grep -qE '^(200|301|308)'
      - name: "HTTPS: 유효한 인증서로 200 응답"
        if: always()
        run: curl -sS -o /dev/null -w '%{http_code}\n' "https://$DOMAIN/" | grep -q '^200'
      - name: "내용: 전.통.미. 페이지가 맞음"
        if: always()
        run: curl -sSL "https://$DOMAIN/" | grep -q '전<i>.</i>통<i>.</i>미'
      - name: "데이터: data/index.json 로드"
        if: always()
        run: curl -sSL "https://$DOMAIN/data/index.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['issues']), 'issues'); assert d['issues']"
      - name: "옛 주소: github.io가 새 도메인으로 이동"
        if: always()
        run: curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url}\n' "https://cyo5812.github.io/jeontongmi/" | tee /dev/stderr | grep -q "$DOMAIN"
      - name: "공유 링크: 새 도메인 ?d=날짜 주소가 200"
        if: always()
        run: |
          D=$(curl -sSL "https://$DOMAIN/data/index.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['issues'][0]['date'])")
          curl -sS -o /dev/null -w '%{http_code} %{url_effective}\n' -L "https://$DOMAIN/?d=$D" | tee /dev/stderr | grep -q '^200'
      - name: "공유 링크: 옛 주소 ?d=날짜가 새 도메인으로 이동해 200"
        if: always()
        run: |
          curl -sS -o /dev/null -w '%{http_code} %{url_effective}\n' -L "https://cyo5812.github.io/jeontongmi/?d=2026-10-25" | tee /dev/stderr | grep -q "^200 https://$DOMAIN/"
      - name: "공유 링크: 저장소 이름 없는 github.io 주소는 404"
        if: always()
        run: |
          curl -sS -o /dev/null -w '%{http_code}\n' "https://cyo5812.github.io/?d=2026-10-25" | tee /dev/stderr | grep -q '^404'
      - name: "인증서: CAA 레코드가 Let's Encrypt 발급을 막지 않음"
        if: always()
        run: |
          for h in "$DOMAIN" kro.kr; do echo "$h: $(dig +short CAA $h | tr '\n' ' ')"; done
          C=$(dig +short CAA "$DOMAIN"; dig +short CAA kro.kr)
          [ -z "$C" ] || echo "$C" | grep -qi letsencrypt
      - name: "인증서: 443 포트가 이 도메인 인증서를 내줌"
        if: always()
        run: echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName | tee /dev/stderr | grep -q "$DOMAIN"
