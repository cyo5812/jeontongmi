name: 시장 데이터 수집

# 시장 데이터는 하루 한 번, 전일 종가 기준으로만 갱신한다(사용량 절감, '오늘 움직인 숫자'의 기준).
# GitHub 예약 실행은 몇 시간씩 늦거나 건너뛸 때가 있어서, 아침 발행 세션이 데이터가 오늘 것이 아니면
# 이 워크플로를 직접 실행한다(EDITORIAL.md 2장 4번). 아래 예약은 예비 실행이다.
on:
  schedule:
    - cron: "10 21 * * *"   # 06:10 KST 매일 · 전일 종가 (미국 장은 서머타임 해제 후 06:00 KST에 마감)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto(KST 시각으로 자동) / close(종가) / open(개장가) / intraday(현재가)"
        default: auto

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 주가·박스오피스·공시 수집
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python3 scripts/fetch_market.py
      - name: 변경분 커밋
        run: |
          MODE=$(python3 -c "import json;print(json.load(open('data/market.json')).get('mode',''))")
          git config user.name "jeontongmi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 시장 데이터 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') ($MODE)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
