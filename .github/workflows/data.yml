name: 시장 데이터 수집

# GitHub 예약 실행은 몇 분~몇 시간 늦어질 수 있다. 그래서 화면에는 실행 시각이 아니라 실제 시세 시각을 표시한다.
on:
  schedule:
    - cron: "10 21 * * *"   # 06:10 KST 매일 · 전일 종가 (미국 장은 서머타임 해제 후 06:00 KST에 마감)
    - cron: "25 0 * * 1-5"  # 09:25 KST 평일 · 개장가 (국내 시세는 약 20분 지연)
    - cron: "25 3 * * 1-5"  # 12:25 KST 평일 · 정오 무렵 현재가
    - cron: "55 6 * * 1-5"  # 15:55 KST 평일 · 당일 종가
  workflow_dispatch:
    inputs:
      mode:
        description: "close(종가) / open(개장가) / intraday(현재가)"
        default: close

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 주가·박스오피스·공시 수집
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '25 0 * * 1-5' && 'open') || (github.event.schedule == '25 3 * * 1-5' && 'intraday') || 'close' }}
        run: python3 scripts/fetch_market.py
      - name: 변경분 커밋
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '25 0 * * 1-5' && 'open') || (github.event.schedule == '25 3 * * 1-5' && 'intraday') || 'close' }}
        run: |
          git config user.name "jeontongmi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 시장 데이터 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') ($MODE)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
