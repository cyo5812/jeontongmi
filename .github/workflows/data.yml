name: 시장 데이터 수집

# GitHub 예약 실행은 몇 시간씩 늦거나 건너뛸 때가 있다. 그래서 정시 수집은 Claude 예약 작업(발행 데스크 세션)이
# 이 워크플로를 직접 실행한다: 09:25 개장가, 12:25 장중, 15:55 종가(평일), 아침 발행 때 전일 종가.
# 아래 예약은 그마저 실패했을 때를 위한 하루 한 번의 예비 실행이다. 화면에는 실제 시세 시각이 표시된다.
on:
  schedule:
    - cron: "10 21 * * *"   # 06:10 KST 매일 · 전일 종가 (미국 장은 서머타임 해제 후 06:00 KST에 마감)
  workflow_dispatch:
    inputs:
      mode:
        description: "close(종가) / open(개장가) / intraday(현재가)"
        default: close

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 주가·박스오피스·공시 수집
        env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          MODE: ${{ github.event.inputs.mode || 'close' }}
        run: python3 scripts/fetch_market.py
      - name: 변경분 커밋
        env:
          MODE: ${{ github.event.inputs.mode || 'close' }}
        run: |
          git config user.name "jeontongmi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 시장 데이터 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') ($MODE)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
