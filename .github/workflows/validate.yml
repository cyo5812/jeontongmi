name: 발행본 검증

on:
  push:
    paths: ["data/issues/**", "data/glossary.json", "scripts/validate_issue.py"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_issue.py
      - name: index.json이 최신인지 확인
        run: git diff --exit-code data/index.json || (echo "validate_issue.py를 실행하고 index.json을 함께 커밋하세요" && exit 1)
